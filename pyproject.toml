[project]
name = "vektor-9"
version = "0.1.0"
description = "A cyberpunk city simulation that advances every 5 minutes."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]
infra = [
    "aws-cdk-lib==2.277.0",
    "constructs==10.8.1",
]
# bundled into the tick package (ADR-0017): boto3 and every dependency, exact
lambda = [
    "boto3==1.44.3",
    "botocore==1.44.3",
    "jmespath==1.1.0",
    "python-dateutil==2.9.0.post0",
    "s3transfer==0.19.3",
    "six==1.17.0",
    "urllib3==2.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
