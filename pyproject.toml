[project]
name = "vektor-9"
version = "0.1.0"
description = "A cyberpunk city simulation that advances every 5 minutes."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
