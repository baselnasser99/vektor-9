name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --import ./tests/js/three-loader.mjs --test "tests/js/*.test.mjs"
      # CDK synth of both stages and the template tests; no AWS credentials or secrets
      - run: uv sync --locked --group infra --group lambda
      - run: uv run --group infra --group lambda pytest tests/infra
